[package]
name = "diagprint"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
description = "Pretty, structured diagnostics and reports for Rust applications."
license = "MIT OR Apache-2.0"
repository = "https://github.com/darkstardevx/diagprint"
homepage = "https://github.com/darkstardevx/diagprint"
documentation = "https://docs.rs/diagprint"
readme = "README.md"
keywords = ["diagnostics", "errors", "logging", "terminal", "reporting"]
categories = ["command-line-utilities", "development-tools::debugging"]

exclude = [
    "/.github/",
    "/.gitignore",
    "/reports/",
]

[features]
default = []

derive = ["dep:diagprint-derive"]

compression = [
    "dep:flate2",
    "dep:zstd",
]

cybercore = [
    "dep:cybercore",
]

terminal-docs = [
    "dep:reqwest",
    "dep:html2text",
    "dep:scraper",
    "dep:syntect",
]

anyhow = [
    "dep:anyhow",
]

tracing = [
    "dep:tracing",
    "dep:tracing-subscriber",
]

miette = [
    "dep:miette",
]

codespan-reporting = [
    "dep:codespan-reporting",
]

ariadne = [
    "dep:ariadne",
]

annotate-snippets = [
    "dep:annotate-snippets",
]

[dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
hostname = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
uuid = { version = "1", features = ["v7", "serde"] }
unicode-width = "0.2"
terminal_size = "0.4"

[dependencies.diagprint-derive]
version = "0.7.0"
path = "crates/diagprint-derive"
optional = true

[dependencies.anyhow]
version = "1"
optional = true
[dependencies.tracing]
version = "0.1"
optional = true
[dependencies.tracing-subscriber]
version = "0.3"
optional = true
[dependencies.miette]
version = "7.6"
optional = true
default-features = false
[dependencies.codespan-reporting]
version = "0.13.1"
optional = true
default-features = false
features = ["std"]
[dependencies.ariadne]
version = "0.6"
optional = true
default-features = false
[dependencies.annotate-snippets]
version = "0.12.16"
optional = true
[dependencies.flate2]
version = "1"
optional = true
[dependencies.zstd]
version = "0.13"
optional = true
[dependencies.cybercore]
version = "0.4.0"
git = "https://github.com/darkstardevx/cybercore.git"
optional = true
[dependencies.reqwest]
version = "0.13"
optional = true
default-features = false
features = ["blocking", "rustls", "charset"]
[dependencies.html2text]
version = "0.17"
optional = true
[dependencies.scraper]
# scraper 0.26+ uses let-chains unavailable on diagprint's Rust 1.85 MSRV.
version = "=0.25.0"
optional = true
[dependencies.syntect]
version = "5.3"
optional = true
default-features = false
features = ["default-fancy"]
[dev-dependencies]
thiserror = "2"

[[example]]
name = "cybercore"
required-features = ["cybercore"]

[[example]]
name = "terminal_docs"
required-features = ["terminal-docs"]

[[example]]
name = "anyhow_integration"
required-features = ["anyhow"]

[[example]]
name = "tracing_integration"
required-features = ["tracing"]

[[example]]
name = "miette_integration"
required-features = ["miette"]

[[example]]
name = "codespan_integration"
required-features = ["codespan-reporting"]

[[example]]
name = "ariadne_integration"
required-features = ["ariadne"]

[[example]]
name = "annotate_snippets_integration"
required-features = ["annotate-snippets"]


[workspace]
members = [
    "crates/diagprint-derive",
    "crates/diagprint-lsp",
    "crates/diagprint-async",
    "crates/diagprint-otel",
]
resolver = "3"
