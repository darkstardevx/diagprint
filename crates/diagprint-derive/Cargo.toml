[package]
name = "diagprint-derive"
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
description = "Derive macros for diagprint structured diagnostics."
license = "MIT OR Apache-2.0"
repository = "https://github.com/darkstardevx/diagprint"
homepage = "https://github.com/darkstardevx/diagprint"
documentation = "https://docs.rs/diagprint-derive"
readme = "README.md"
keywords = ["diagnostics", "derive", "errors", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
trybuild = "1.0"
