[package]
name = "diagprint-axum"
version = "0.8.1"
edition = "2024"
rust-version = "1.85"
description = "Privacy-safe Axum HTTP responses for the diagprint diagnostics lifecycle framework."
license = "MIT OR Apache-2.0"
repository = "https://github.com/darkstardevx/diagprint"
homepage = "https://github.com/darkstardevx/diagprint"
documentation = "https://docs.rs/diagprint-axum"
readme = "README.md"
keywords = ["diagnostics", "axum", "http", "errors", "web"]
categories = ["web-programming::http-server", "development-tools::debugging"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
async-delivery = ["dep:diagprint-async"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }

[dependencies.axum]
version = "0.8.9"
default-features = false
features = ["form", "json", "query", "matched-path"]

[dependencies.diagprint]
version = "0.7.1"
path = "../.."

[dependencies.diagprint-async]
version = "0.7.0"
path = "../diagprint-async"
optional = true

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }

[[example]]
name = "sync_app"
path = "examples/sync_app.rs"


[[example]]
name = "async_app"
path = "examples/async_app.rs"
required-features = ["async-delivery"]
