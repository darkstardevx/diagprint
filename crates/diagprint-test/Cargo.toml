[package]
name = "diagprint-test"
version = "0.7.0"
edition = "2024"
rust-version = "1.85"
description = "Testing assertions and snapshot helpers for the diagprint diagnostics lifecycle framework."
license = "MIT OR Apache-2.0"
repository = "https://github.com/darkstardevx/diagprint"
homepage = "https://github.com/darkstardevx/diagprint"
documentation = "https://docs.rs/diagprint-test"
readme = "README.md"
keywords = ["diagnostics", "testing", "snapshots", "assertions", "errors"]
categories = ["development-tools::testing"]

[dependencies]
diagprint = { version = "0.7.0", path = "../.." }
serde_json = { version = "1", features = ["arbitrary_precision"] }
