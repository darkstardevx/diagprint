[package]
name = "diagprint-snafu"
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
description = "Structured SNAFU interoperability for diagprint."
license = "MIT OR Apache-2.0"
repository = "https://github.com/darkstardevx/diagprint"
homepage = "https://github.com/darkstardevx/diagprint"
documentation = "https://docs.rs/diagprint-snafu"
readme = "README.md"
keywords = ["diagnostics", "errors", "snafu", "interop", "reporting"]
categories = ["development-tools::debugging", "rust-patterns"]

[features]
default = []

[dependencies.diagprint]
version = "0.8.0"
path = "../.."

[dependencies.diagprint-bridge]
version = "0.8.0"
path = "../diagprint-bridge"

[dependencies.snafu]
version = "0.9.2"
default-features = false
features = ["std"]
