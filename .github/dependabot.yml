version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: "/crates/diagprint-axum/fuzz"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
