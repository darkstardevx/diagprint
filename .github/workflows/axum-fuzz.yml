name: Axum Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - request_id
          - problem_extension

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-fuzz
        run: >-
          cargo install
          cargo-fuzz
          --locked
          --version 0.13.2

      - name: Fuzz ${{ matrix.target }}
        working-directory: crates/diagprint-axum/fuzz
        run: >-
          cargo fuzz run
          ${{ matrix.target }}
          --
          -max_total_time=90
          -timeout=10
