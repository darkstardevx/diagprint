name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy all features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check default features
        run: cargo check --workspace --all-targets

      - name: Test default features
        run: cargo test --workspace --all-targets

      - name: Test default rustdoc
        run: cargo test --workspace --doc

      - name: Check all features
        run: cargo check --workspace --all-targets --all-features

      - name: Test all features
        run: cargo test --workspace --all-targets --all-features

      - name: Test all-feature rustdoc
        run: cargo test --workspace --doc --all-features

      - name: Inspect package contents
        run: cargo package --list -p diagprint && cargo package --list -p diagprint-derive

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest

    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      # The repository lockfile is generated by the current stable toolchain
      # and can contain transitive releases whose MSRV is newer than diagprint's.
      # Library consumers do not inherit this lockfile, so resolve afresh using
      # Cargo's MSRV-aware fallback policy.
      - name: Resolve dependencies for MSRV
        run: rm -f Cargo.lock

      - name: Check all targets and features on MSRV
        run: cargo check --workspace --all-targets --all-features

      - name: Check rustdoc examples on MSRV
        run: cargo test --workspace --doc --all-features
