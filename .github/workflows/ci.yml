name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check diff whitespace
        run: git diff --check

      - name: Clippy
        run: >
          cargo clippy
          --workspace
          --all-targets
          --
          -D warnings

      - name: Clippy all features
        run: >
          cargo clippy
          --workspace
          --all-targets
          --all-features
          --
          -D warnings

      - name: Clippy tracing feature in isolation
        run: >
          cargo clippy
          -p diagprint
          --no-default-features
          --features tracing
          --all-targets
          --
          -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check default features
        run: >
          cargo check
          --workspace
          --all-targets

      - name: Test default features
        run: >
          cargo test
          --workspace
          --all-targets

      - name: Test default rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >
          cargo test
          --workspace
          --doc

      - name: Check all features
        run: >
          cargo check
          --workspace
          --all-targets
          --all-features

      - name: Test all features
        run: >
          cargo test
          --workspace
          --all-targets
          --all-features

      - name: Test all-feature rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >
          cargo test
          --workspace
          --doc
          --all-features

      - name: Build strict rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >
          cargo doc
          --workspace
          --no-deps
          --all-features

      - name: Check tracing feature in isolation
        run: >
          cargo check
          -p diagprint
          --no-default-features
          --features tracing
          --all-targets

      - name: Test tracing feature in isolation
        run: >
          cargo test
          -p diagprint
          --no-default-features
          --features tracing
          --test tracing_integration

      - name: Check root feature matrix
        shell: bash
        run: |
          set -euo pipefail

          for feature in \
            artifact-store \
            derive \
            compression \
            cybercore \
            html \
            terminal-docs \
            anyhow \
            tracing \
            miette \
            codespan-reporting \
            ariadne \
            annotate-snippets
          do
            echo "===== feature: $feature ====="

            cargo check \
              -p diagprint \
              --no-default-features \
              --features "$feature" \
              --all-targets
          done

      - name: Remove trybuild scratch state
        if: always()
        run: rm -rf target/tests

  package:
    name: Package readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Inspect all package contents
        shell: bash
        run: |
          set -euo pipefail

          packages=(
            diagprint
            diagprint-bridge
            diagprint-error-stack
            diagprint-derive
            diagprint-lsp
            diagprint-async
            diagprint-otel
            diagprint-test
          )

          for package in "${packages[@]}"
          do
            echo
            echo "===== package contents: $package ====="

            cargo package \
              --list \
              -p "$package"
          done

      - name: Reject generated state from core package
        shell: bash
        run: |
          set -euo pipefail

          package_list="$(
            cargo package \
              --list \
              -p diagprint
          )"

          if grep -Eq '^\.diagprint(/|$)' <<<"$package_list"
          then
            echo "ERROR: .diagprint generated state is present in the diagprint package"
            exit 1
          fi

          if grep -Eq '^reports(/|$)' <<<"$package_list"
          then
            echo "ERROR: generated reports are present in the diagprint package"
            exit 1
          fi

          echo "Generated diagnostic state is excluded from the core package."

      - name: Build first-stage publishable archive
        run: >
          cargo package
          --no-verify
          -p diagprint-derive

      - name: Show first-stage archive
        shell: bash
        run: |
          set -euo pipefail

          metadata="$(
            cargo metadata \
              --no-deps \
              --format-version 1
          )"

          derive_version="$(
            python3 -c '
import json
import sys

metadata = json.load(sys.stdin)

for package in metadata["packages"]:
    if package["name"] == "diagprint-derive":
        print(package["version"])
        break
else:
    raise SystemExit("diagprint-derive package metadata not found")
' <<<"$metadata"
          )"

          target_directory="$(
            python3 -c '
import json
import sys

metadata = json.load(sys.stdin)
print(metadata["target_directory"])
' <<<"$metadata"
          )"

          archive="${target_directory}/package/diagprint-derive-${derive_version}.crate"

          if [[ ! -f "$archive" ]]
          then
            echo "ERROR: expected first-stage archive is missing: $archive"
            echo "Cargo target directory: $target_directory"
            echo "diagprint-derive version: $derive_version"
            echo
            echo "Available package archives:"

            find \
              "${target_directory}/package" \
              -maxdepth 1 \
              -type f \
              -name '*.crate' \
              -print 2>/dev/null || true

            exit 1
          fi

          ls -lh "$archive"

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest

    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Resolve dependencies for MSRV
        run: rm -f Cargo.lock

      - name: Check all targets and features on MSRV
        run: >
          cargo check
          --workspace
          --all-targets
          --all-features

      - name: Test all targets and features on MSRV
        run: >
          cargo test
          --workspace
          --all-targets
          --all-features

      - name: Test rustdoc examples on MSRV
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >
          cargo test
          --workspace
          --doc
          --all-features

      - name: Build rustdoc on MSRV
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >
          cargo doc
          --workspace
          --no-deps
          --all-features

      - name: Check tracing feature alone on MSRV
        run: >
          cargo check
          -p diagprint
          --no-default-features
          --features tracing
          --all-targets

      - name: Remove trybuild scratch state
        if: always()
        run: rm -rf target/tests
