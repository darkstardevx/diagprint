name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check diff whitespace
        run: git diff --check

      - name: Clippy
        run: >
          cargo clippy
          --workspace
          --all-targets
          --
          -D warnings

      - name: Clippy all features
        run: >
          cargo clippy
          --workspace
          --all-targets
          --all-features
          --
          -D warnings

      - name: Clippy tracing feature in isolation
        run: >
          cargo clippy
          -p diagprint
          --no-default-features
          --features tracing
          --all-targets
          --
          -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check default features
        run: >
          cargo check
          --workspace
          --all-targets

      - name: Test default features
        run: >
          cargo test
          --workspace
          --all-targets

      - name: Test default rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >
          cargo test
          --workspace
          --doc

      - name: Check all features
        run: >
          cargo check
          --workspace
          --all-targets
          --all-features

      - name: Test all features
        run: >
          cargo test
          --workspace
          --all-targets
          --all-features

      - name: Check diagprint-axum feature isolation
        shell: bash
        run: |
          set -euo pipefail

          cargo check \
            -p diagprint-axum \
            --no-default-features \
            --all-targets

          if cargo tree \
            -p diagprint-axum \
            --no-default-features \
            -e normal,build \
            | grep -q 'diagprint-async v'
          then
            echo "ERROR: diagprint-async leaked into the default Axum dependency graph"
            exit 1
          fi

          cargo check \
            -p diagprint-axum \
            --no-default-features \
            --features async-delivery \
            --all-targets

          cargo test \
            -p diagprint-axum \
            --no-default-features \
            --features async-delivery \
            --all-targets

          if ! cargo tree \
            -p diagprint-axum \
            --no-default-features \
            --features async-delivery \
            -e normal,build \
            | grep -q 'diagprint-async v'
          then
            echo "ERROR: async-delivery did not activate diagprint-async"
            exit 1
          fi

          echo "diagprint-axum feature isolation is intact."


      - name: Test all-feature rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >
          cargo test
          --workspace
          --doc
          --all-features

      - name: Build strict rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >
          cargo doc
          --workspace
          --no-deps
          --all-features

      - name: Check tracing feature in isolation
        run: >
          cargo check
          -p diagprint
          --no-default-features
          --features tracing
          --all-targets

      - name: Test tracing feature in isolation
        run: >
          cargo test
          -p diagprint
          --no-default-features
          --features tracing
          --test tracing_integration

      - name: Check root feature matrix
        shell: bash
        run: |
          set -euo pipefail

          for feature in \
            artifact-store \
            derive \
            compression \
            cybercore \
            html \
            terminal-docs \
            anyhow \
            tracing \
            miette \
            codespan-reporting \
            ariadne \
            annotate-snippets
          do
            echo "===== feature: $feature ====="

            cargo check \
              -p diagprint \
              --no-default-features \
              --features "$feature" \
              --all-targets
          done

      - name: Remove trybuild scratch state
        if: always()
        run: rm -rf target/tests

  package:
    name: Package readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Inspect all package contents
        shell: bash
        run: |
          set -euo pipefail

          packages=(
            diagprint
            diagprint-derive
            diagprint-lsp
            diagprint-async
            diagprint-axum
            diagprint-otel
            diagprint-test
          )

          for package in "${packages[@]}"
          do
            echo
            echo "===== package contents: $package ====="

            cargo package \
              --list \
              -p "$package"
          done

      - name: Reject generated state from core package
        shell: bash
        run: |
          set -euo pipefail

          package_list="$(
            cargo package \
              --list \
              -p diagprint
          )"

          if grep -Eq '^\.diagprint(/|$)' <<<"$package_list"
          then
            echo "ERROR: .diagprint generated state is present in the diagprint package"
            exit 1
          fi

          if grep -Eq '^reports(/|$)' <<<"$package_list"
          then
            echo "ERROR: generated reports are present in the diagprint package"
            exit 1
          fi

          echo "Generated diagnostic state is excluded from the core package."

      - name: Build first-stage publishable archive
        run: >
          cargo package
          --no-verify
          -p diagprint-derive

      - name: Show first-stage archive
        run: ls -lh target/package/diagprint-derive-0.7.0.crate

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest

    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Resolve dependencies for MSRV
        run: rm -f Cargo.lock

      - name: Check all targets and features on MSRV
        run: >
          cargo check
          --workspace
          --all-targets
          --all-features

      - name: Test all targets and features on MSRV
        run: >
          cargo test
          --workspace
          --all-targets
          --all-features

      - name: Test rustdoc examples on MSRV
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >
          cargo test
          --workspace
          --doc
          --all-features

      - name: Build rustdoc on MSRV
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >
          cargo doc
          --workspace
          --no-deps
          --all-features

      - name: Check tracing feature alone on MSRV
        run: >
          cargo check
          -p diagprint
          --no-default-features
          --features tracing
          --all-targets

      - name: Remove trybuild scratch state
        if: always()
        run: rm -rf target/tests
