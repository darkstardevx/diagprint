name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check diff whitespace
        run: git diff --check

      - name: Clippy
        run: >
          cargo clippy
          --workspace
          --all-targets
          --
          -D warnings

      - name: Clippy all features
        run: >
          cargo clippy
          --workspace
          --all-targets
          --all-features
          --
          -D warnings

      - name: Clippy tracing feature in isolation
        run: >
          cargo clippy
          -p diagprint
          --no-default-features
          --features tracing
          --all-targets
          --
          -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Check default features
        run: >
          cargo check
          --workspace
          --all-targets

      - name: Test default features
        run: >
          cargo test
          --workspace
          --all-targets

      - name: Test default rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >
          cargo test
          --workspace
          --doc

      - name: Check all features
        run: >
          cargo check
          --workspace
          --all-targets
          --all-features

      - name: Test all features
        run: >
          cargo test
          --workspace
          --all-targets
          --all-features

      - name: Test all-feature rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >
          cargo test
          --workspace
          --doc
          --all-features

      - name: Build strict rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >
          cargo doc
          --workspace
          --no-deps
          --all-features

      - name: Check tracing feature in isolation
        run: >
          cargo check
          -p diagprint
          --no-default-features
          --features tracing
          --all-targets

      - name: Test tracing feature in isolation
        run: >
          cargo test
          -p diagprint
          --no-default-features
          --features tracing
          --test tracing_integration

      - name: Check root feature matrix
        shell: bash
        run: |
          set -euo pipefail

          for feature in \
            derive \
            compression \
            cybercore \
            terminal-docs \
            anyhow \
            tracing \
            miette \
            codespan-reporting \
            ariadne \
            annotate-snippets
          do
            echo "===== feature: $feature ====="

            cargo check \
              -p diagprint \
              --no-default-features \
              --features "$feature" \
              --all-targets
          done

      - name: Inspect package contents
        run: |
          cargo package --list -p diagprint
          cargo package --list -p diagprint-derive
          cargo package --list -p diagprint-lsp
          cargo package --list -p diagprint-async
          cargo package --list -p diagprint-otel

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest

    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.85
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Resolve dependencies for MSRV
        run: rm -f Cargo.lock

      - name: Check all targets and features on MSRV
        run: >
          cargo check
          --workspace
          --all-targets
          --all-features

      - name: Test all targets and features on MSRV
        run: >
          cargo test
          --workspace
          --all-targets
          --all-features

      - name: Test rustdoc examples on MSRV
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >
          cargo test
          --workspace
          --doc
          --all-features

      - name: Build rustdoc on MSRV
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: >
          cargo doc
          --workspace
          --no-deps
          --all-features

      - name: Check tracing feature alone on MSRV
        run: >
          cargo check
          -p diagprint
          --no-default-features
          --features tracing
          --all-targets
